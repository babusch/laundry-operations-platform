name: laundry-operations-platform

services:
  postgres:
    image: postgres:18.6-alpine3.23
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-laundry}
      POSTGRES_USER: ${POSTGRES_USER:-laundry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-laundry_local_dev_only}
      POSTGRES_INITDB_ARGS: --data-checksums
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    shm_size: 128mb
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready --username "$${POSTGRES_USER}" --dbname "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
