openapi: 3.1.0
info:
  title: Laundry station gateway API
  version: 1.0.0
  description: Development contract used to generate the station PWA client.
paths:
  /api/development/scan-preview:
    post:
      operationId: previewDevelopmentScan
      summary: Recognize a synthetic RFID fixture and resolve its customer's downloaded planned orders
      description: >-
        Development-only. Requires explicit DevelopmentScanPreview, DevelopmentItemLookup and LocalOrderList enablement,
        trusted loopback HTTPS localhost:7200, active demo browser source, scans.submit, orders.read and antiforgery.
        The server derives customer from its fixture catalog; caller scope/customer/order fields and query parameters are forbidden.
        Reads all relevant local pages, not the visible browser page. Maximum 100 pages of 50 and 50 matching orders;
        exceeding bounds or concurrent download changes fails without a partial result. No cloud call or business writes.
        All returned orders are planned, not started/selected/reserved. No notes or customer references.
      security:
        - sourceCookie: []
          antiforgeryHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevelopmentItemLookupRequest"
      responses:
        "200":
          description: Complete bounded preview result; download activity is not freshness proof.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Vary:
              schema: { type: string, const: Cookie }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentScanPreviewResult"
        "400":
          $ref: "#/components/responses/DevelopmentItemLookupFailure"
        "401":
          $ref: "#/components/responses/DevelopmentItemLookupFailure"
        "403":
          $ref: "#/components/responses/DevelopmentItemLookupFailure"
        "404":
          description: Feature disabled or host not Development.
        "409":
          $ref: "#/components/responses/DevelopmentItemLookupFailure"
        "413":
          $ref: "#/components/responses/DevelopmentItemLookupFailure"
        "415":
          $ref: "#/components/responses/DevelopmentItemLookupFailure"
        "503":
          $ref: "#/components/responses/DevelopmentItemLookupFailure"
  /api/development/item-lookup:
    post:
      operationId: lookupDevelopmentItem
      summary: Resolve a synthetic RFID fixture locally without recording a scan
      description: >-
        Development-only and opt-in DevelopmentItemLookup:Enabled (default false).
        Trusted loopback HTTPS localhost:7200, active browser source, scans.submit and antiforgery required.
        Only the fixed demo tenant/plant has fixture data. No cloud call, order selection,
        receiving activation, database write or production ownership assertion. Request body is bounded to 1024 bytes.
        Unknown values return notRecognized, not an inferred customer. Query parameters are forbidden.
      security:
        - sourceCookie: []
          antiforgeryHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevelopmentItemLookupRequest"
      responses:
        "200":
          description: Synthetic recognized item or explicit notRecognized result; never echoes the identifier.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
            Vary:
              schema: { type: string, const: Cookie }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentItemLookupResult"
        "400":
          $ref: "#/components/responses/DevelopmentItemLookupFailure"
        "401":
          $ref: "#/components/responses/DevelopmentItemLookupFailure"
        "403":
          $ref: "#/components/responses/DevelopmentItemLookupFailure"
        "404":
          description: Feature disabled, scan acceptance disabled or not Development.
        "413":
          $ref: "#/components/responses/DevelopmentItemLookupFailure"
        "415":
          $ref: "#/components/responses/DevelopmentItemLookupFailure"
        "503":
          $ref: "#/components/responses/DevelopmentItemLookupFailure"
  /api/order-plans:
    get:
      operationId: getLocalOrderPlans
      summary: List locally downloaded order summaries for the enrolled station's plant
      description: >-
        Development-only, opt-in LocalOrderList:Enabled on trusted loopback HTTPS localhost:7200.
        Requires an active browser source and separate orders.read permission; scans.submit alone is insufficient.
        Does not call the cloud, grant access or select/start an order. No notes are returned.
        Ordered by local order UUID. A download progress change invalidates continuation cursors;
        restart from the first page on 409. No production operator authentication is implemented.
      security:
        - sourceCookie: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 50
        - in: query
          name: cursor
          description: Opaque local list cursor, not the cloud download bookmark. Unknown/repeated query parameters are rejected.
          schema:
            type: string
            minLength: 1
            maxLength: 2048
      responses:
        "200":
          description: A coherent local page; empty does not prove that a download has occurred.
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Vary:
              schema:
                type: string
                const: Cookie
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalOrderPage"
        "400":
          $ref: "#/components/responses/LocalOrderFailure"
        "401":
          $ref: "#/components/responses/LocalOrderFailure"
        "403":
          $ref: "#/components/responses/LocalOrderFailure"
        "404":
          description: Route not enabled or host is not Development.
        "409":
          $ref: "#/components/responses/LocalOrderFailure"
        "503":
          $ref: "#/components/responses/LocalOrderFailure"
  /health/ready:
    get:
      operationId: getGatewayReadiness
      summary: Check whether durable plant storage is available
      responses:
        "200":
          description: The gateway process and plant storage are ready.
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: The gateway is running but plant storage is unavailable.
          content:
            text/plain:
              schema:
                type: string
  /api/source-session:
    get:
      operationId: getSourceSession
      summary: Check the browser's enrolled source session
      security:
        - sourceCookie: []
      responses:
        "200":
          description: The browser has an active enrolled source session.
          headers:
            Cache-Control:
              description: Session details must not be cached.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SourceSession"
        "401":
          description: The browser has no active enrolled source session.
        "403":
          description: Source sessions require trusted HTTPS.
        "503":
          $ref: "#/components/responses/Problem"
  /api/development/source-enrollments:
    post:
      operationId: createDevelopmentSourceEnrollment
      summary: Create a single-use enrollment for this local Development gateway
      responses:
        "201":
          description: A pending source and short-lived enrollment code were created.
          headers:
            Cache-Control:
              description: Enrollment material must not be cached.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevelopmentEnrollment"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/source-enrollment/exchange:
    post:
      operationId: exchangeSourceEnrollment
      summary: Exchange a single-use enrollment code for a secure browser credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollmentExchange"
      responses:
        "204":
          description: The browser credential was created and set as a secure cookie.
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/scans:
    post:
      operationId: submitScan
      summary: Durably submit a raw scan observation
      security:
        - sourceCookie: []
          antiforgeryHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitScanV2"
      responses:
        "200":
          description: The unchanged event was already accepted locally.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalReceipt"
        "201":
          description: The event was durably accepted locally.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalReceipt"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "413":
          $ref: "#/components/responses/Problem"
        "415":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/sync/summary:
    get:
      operationId: getSynchronizationSummary
      summary: Read the local gateway-to-cloud delivery summary
      responses:
        "200":
          description: Counts and timing metadata for this development plant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueSummary"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
  /api/sync/events:
    get:
      operationId: listSynchronizationEvents
      summary: List delivery metadata without scan payloads or identifiers
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/DeliveryStatus"
        - name: order
          in: query
          schema:
            type: string
            enum: [oldest, latest]
            default: oldest
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A bounded page of delivery metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuePage"
        "400":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    sourceCookie:
      type: apiKey
      in: cookie
      name: __Host-laundry-source
      description: Secure enrolled-source cookie managed by the browser.
    antiforgeryHeader:
      type: apiKey
      in: header
      name: X-Laundry-CSRF
      description: Antiforgery token obtained from the authenticated source session.
  schemas:
    DevelopmentScanPreviewResult:
      type: object
      additionalProperties: false
      required: [isSynthetic, status, item, orders, lastSuccessfulPageAtUtc]
      properties:
        isSynthetic:
          type: boolean
          const: true
        status:
          type: string
          enum: [notRecognized, noLocalOrders, onePlannedOrder, multiplePlannedOrders]
        item:
          description: Null only when notRecognized; customer comes from the gateway fixture, not caller input.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DevelopmentTextileItem"
        orders:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/LocalOrderSummary"
        lastSuccessfulPageAtUtc:
          type: [string, "null"]
          format: date-time
          description: Last committed download-page activity; null for unknown item or before a download. Not freshness proof.
    DevelopmentItemLookupRequest:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier:
          type: object
          additionalProperties: false
          required: [technology, value]
          properties:
            technology:
              type: string
              const: rfid
            value:
              type: string
              minLength: 1
              maxLength: 256
              description: Exact case-sensitive value; no surrounding whitespace or control characters. Synthetic fixtures only.
    DevelopmentItemLookupResult:
      type: object
      additionalProperties: false
      required: [isSynthetic, status, item]
      properties:
        isSynthetic:
          type: boolean
          const: true
        status:
          type: string
          enum: [recognized, notRecognized]
        item:
          description: Null for notRecognized; a synthetic fixture for recognized. No tag value or order association.
          oneOf:
            - type: "null"
            - $ref: "#/components/schemas/DevelopmentTextileItem"
    DevelopmentTextileItem:
      type: object
      additionalProperties: false
      required: [id, displayName, articleType, customer]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        articleType:
          type: string
          enum: [towel, sheet, mop]
        customer:
          type: object
          additionalProperties: false
          required: [id, code, displayName]
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            displayName:
              type: string
    DevelopmentItemLookupError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
    LocalOrderPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore, lastSuccessfulPageAtUtc]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/LocalOrderSummary"
        nextCursor:
          type: [string, "null"]
          maxLength: 2048
          description: Null when this page has no continuation.
        hasMore:
          type: boolean
        lastSuccessfulPageAtUtc:
          type: [string, "null"]
          format: date-time
          description: >-
            UTC time of the last committed download page, including empty polls. Null before any download.
            May describe a partial multi-page download; not proof of catch-up, cloud availability or current freshness.
    LocalOrderSummary:
      type: object
      additionalProperties: false
      required: [id, orderNumber, customer, plannedReceivingDate, plannedDeliveryDate, status, version]
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
        customer:
          type: object
          additionalProperties: false
          required: [id, code, displayName]
          properties:
            id:
              type: string
              format: uuid
            code:
              type: string
            displayName:
              type: string
        plannedReceivingDate:
          type: string
          format: date
        plannedDeliveryDate:
          type: string
          format: date
        status:
          type: string
          const: planned
        version:
          type: integer
          minimum: 1
          maximum: 9007199254740991
    LocalOrderError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          enum:
            - local_order_origin_forbidden
            - local_order_source_required
            - local_order_permission_required
            - invalid_local_order_query
            - invalid_local_order_cursor
            - local_order_list_changed
            - local_order_copy_invalid
            - local_order_storage_unavailable
    DevelopmentEnrollment:
      type: object
      additionalProperties: false
      required:
        - sourceId
        - enrollmentCode
        - expiresAtUtc
      properties:
        sourceId:
          type: string
          format: uuid
        enrollmentCode:
          type: string
        expiresAtUtc:
          type: string
          format: date-time
    EnrollmentExchange:
      type: object
      additionalProperties: false
      required:
        - enrollmentCode
      properties:
        enrollmentCode:
          type: string
    SourceSession:
      type: object
      additionalProperties: false
      required:
        - sourceId
        - stationId
        - permissions
        - antiforgeryToken
        - antiforgeryHeaderName
      properties:
        sourceId:
          type: string
          format: uuid
        stationId:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string
        antiforgeryToken:
          type: string
        antiforgeryHeaderName:
          type: string
    SubmitScanV2:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - eventId
        - eventType
        - correlationId
        - observedAtUtc
        - identifier
      properties:
        schemaVersion:
          $ref: ../../../../packages/contracts/requests/submit-scan.v2.schema.json#/properties/schemaVersion
        eventId:
          $ref: ../../../../packages/contracts/requests/submit-scan.v2.schema.json#/properties/eventId
        eventType:
          $ref: ../../../../packages/contracts/requests/submit-scan.v2.schema.json#/properties/eventType
        correlationId:
          $ref: ../../../../packages/contracts/requests/submit-scan.v2.schema.json#/properties/correlationId
        observedAtUtc:
          $ref: ../../../../packages/contracts/requests/submit-scan.v2.schema.json#/properties/observedAtUtc
        identifier:
          $ref: ../../../../packages/contracts/requests/submit-scan.v2.schema.json#/properties/identifier
    LocalReceipt:
      type: object
      additionalProperties: false
      required:
        - eventId
        - status
        - gatewayAcceptedAtUtc
        - deliveryStatus
      properties:
        eventId:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - acceptedLocally
            - alreadyAcceptedLocally
        gatewayAcceptedAtUtc:
          type: string
          format: date-time
        deliveryStatus:
          $ref: "#/components/schemas/DeliveryStatus"
    DeliveryStatus:
      type: string
      enum:
        - pending
        - synchronized
        - needsAttention
    QueueItem:
      type: object
      additionalProperties: false
      required:
        - eventId
        - status
        - acceptedAtUtc
        - attempts
      properties:
        eventId:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/DeliveryStatus"
        acceptedAtUtc:
          type: string
          format: date-time
        attempts:
          type: integer
          minimum: 0
        nextAttemptAtUtc:
          type: [string, "null"]
          format: date-time
        leaseUntilUtc:
          type: [string, "null"]
          format: date-time
        cloudReceivedAtUtc:
          type: [string, "null"]
          format: date-time
        lastError:
          type: [string, "null"]
    QueuePage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextOffset
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/QueueItem"
        nextOffset:
          type: [integer, "null"]
    WorkerSnapshot:
      type: object
      additionalProperties: false
      required:
        - lastIterationAtUtc
        - lastIterationError
      properties:
        lastIterationAtUtc:
          type: [string, "null"]
          format: date-time
        lastIterationError:
          type: [string, "null"]
    QueueSummary:
      type: object
      additionalProperties: false
      required:
        - asOfUtc
        - pending
        - synchronized
        - needsAttention
        - oldestPendingAgeSeconds
        - lastCloudReceiptAtUtc
        - forwardingEnabled
        - worker
      properties:
        asOfUtc:
          type: string
          format: date-time
        pending:
          type: integer
          minimum: 0
        synchronized:
          type: integer
          minimum: 0
        needsAttention:
          type: integer
          minimum: 0
        oldestPendingAgeSeconds:
          type: [number, "null"]
          minimum: 0
        lastCloudReceiptAtUtc:
          type: [string, "null"]
          format: date-time
        forwardingEnabled:
          type: boolean
        worker:
          $ref: "#/components/schemas/WorkerSnapshot"
    ProblemDetails:
      type: object
      additionalProperties: true
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
  responses:
    DevelopmentItemLookupFailure:
      description: Fixed error code only; no identifier, request body, credentials or storage details.
      headers:
        Cache-Control:
          schema: { type: string, const: no-store }
        Vary:
          schema: { type: string, const: Cookie }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/DevelopmentItemLookupError"
    LocalOrderFailure:
      description: >-
        Safe code only. 400 invalid query/cursor; 401 missing/invalid source; 403 permission/origin denied;
        409 local order progress changed (restart listing); 503 local authentication/order storage unavailable or copy invalid.
        Errors do not mean there are no orders. Responses use no-store. No cloud request or order mutation occurs.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/LocalOrderError"
    Problem:
      description: The request was not accepted.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
