openapi: 3.1.0
info:
  title: Development planned-order planning
  version: 1.0.0
  description: >-
    Opt-in loopback HTTPS management proof. Creation, details, unfiltered lists, planned updates and history reads are implemented.
    No production rollout, receiving, or dispatch is implied.
servers:
  - url: https://localhost:7100
paths:
  /api/v1/plants/{plantId}/orders:
    get:
      operationId: listPlannedOrders
      summary: List saved orders in the authorized plant
      description: >-
        Requires current orders.read and exactly one active tenant assignment for
        the URL plant. Ascending planned receiving date then ID. Protected cursor
        is bound to tenant, plant, limit and unfiltered query version. Keep the limit
        unchanged on continuation. No frozen snapshot across edits/inserts is promised.
        No filters yet; unknown/duplicate query parameters are rejected. No CSRF or
        idempotency key required. Responses are no-store and make no writes.
      security:
        - managementSession: []
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: cursor
          in: query
          description: Pass nextCursor unchanged and URL-encoded; restart from page one if invalid.
          schema:
            type: string
            minLength: 1
            maxLength: 2048
      responses:
        '200':
          description: Public current plans, including orders for deactivated customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          description: Invalid/unsupported query or cursor; invalid_order_query.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Human management session required; gateway credentials cannot list orders.
        '403':
          description: Current permission/scope denied or transport rejected.
        '404':
          description: Feature disabled or outside Development.
        '409':
          description: Ambiguous tenant scope for this plant.
        '503':
          description: Storage unavailable; read can safely be retried.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
    post:
      operationId: createPlannedOrder
      summary: Durably create one planned order
      description: >-
        Tenant and actor are derived from the verified management session and
        current application membership. Exactly one active assignment must resolve
        the plant to a tenant; ambiguous scope is rejected. Duplicate JSON fields
        are rejected. Authorization and customer eligibility participate in the
        order transaction. Retry the exact body/key under the same human identity
        after an uncertain result. An authorized unchanged retry returns the
        original 201 response; customer deactivation does not rewrite that receipt.
        Location identifies the stored order and can be followed with orders.read permission.
      security:
        - managementSession: []
          managementCsrf: []
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          required: true
          description: One nonzero UUID in canonical dashed form, retained for retries.
          schema:
            type: string
            format: uuid
        - name: X-Management-CSRF
          in: header
          required: true
          description: Same-session request token obtained from /management/antiforgery.
          schema:
            type: string
      requestBody:
        required: true
        description: Maximum encoded body size 16 KiB, including chunked bodies.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Order/audit/receipt durably committed, or unchanged authorized replay.
          headers:
            ETag:
              schema:
                type: string
              description: Strong representation validator containing order ID and version.
            Location:
              schema:
                type: string
              description: Protected stored-order detail resource path.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid request/key, invalid dates, ineligible customer, or missing/invalid CSRF token.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: A valid management human session is required; gateway tokens cannot authorize this route.
        '403':
          description: Current permission/scope denied, or Development transport boundary rejected.
        '404':
          description: Feature disabled or outside Development.
        '409':
          description: Changed request reusing a key, or ambiguous tenant scope for this plant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: Encoded request exceeds 16 KiB.
        '415':
          description: Application/json required.
        '503':
          description: Storage unavailable or uncertain commit acknowledgement; retry exact body/key.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/plants/{plantId}/orders/{orderId}:
    get:
      operationId: getPlannedOrder
      summary: Read the current saved order plan
      description: >-
        Requires a verified management session and current orders.read permission.
        Tenant is resolved from exactly one active assignment for the URL plant.
        Unknown orders and orders outside that tenant/plant return the same 404.
        Reads do not change orders, allocate numbers, or create command/audit records.
        Customer deactivation does not hide historical orders. Returns the current
        representation, not a historical creation acknowledgement. No CSRF token or
        idempotency key is required; responses are no-store. Conditional GET is not implemented.
      security:
        - managementSession: []
      parameters:
        - name: plantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current saved plan, excluding internal tenant and actor identity fields.
          headers:
            ETag:
              description: Strong representation validator containing order ID and current version.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          description: Valid human management session required; gateway bearer credentials are insufficient.
        '403':
          description: Current permission/scope denied or Development transport boundary rejected.
        '404':
          description: Scoped order not found, feature disabled, or outside Development.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Ambiguous tenant scope for this plant.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Storage unavailable; read can be retried without creating an order.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/plants/{plantId}/orders/{orderId}/plan:
    put:
      operationId: updatePlannedOrder
      summary: Replace the five planning fields of a planned order
      description: >-
        Requires current orders.plan.edit and one active tenant assignment for the plant.
        Tenant and human actor are derived from the protected session. Permission and
        customer eligibility participate in the order transaction. All five fields must
        be provided; null clears reference or notes. Unknown/duplicate fields are rejected.
        If-Match must be the single strong canonical ID/version ETag from the latest read;
        weak tags, wildcards and lists are not supported. A stale version never overwrites
        another edit. Retain the exact body, If-Match and idempotency key after an uncertain
        result. An authorized exact retry returns the original receipt before checking
        current version or eligibility and never reapplies historical changes. Read current
        details afterward, since a later edit may already exist. Unchanged saves retain
        a receipt but do not advance the version or add a change audit. Responses are no-store.
      security:
        - managementSession: []
          managementCsrf: []
      parameters:
        - name: plantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          description: Fresh nonzero dashed UUID per deliberate save; retain for retries.
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: true
          description: Exact single strong ETag returned by the latest detail read, retained for retries.
          schema: { type: string }
        - name: X-Management-CSRF
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        description: Maximum encoded body size 16 KiB, including chunked bodies.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderPlan'
      responses:
        '200':
          description: Durable update, unchanged save, or historical exact-retry receipt.
          headers:
            ETag:
              schema: { type: string }
            Location:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Invalid fields, eligibility, key, CSRF, or malformed/unsupported If-Match.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Valid human management session required; gateway credentials cannot edit.
        '403':
          description: Current permission/scope denied or transport rejected.
        '404':
          description: Order absent from authorized scope, feature disabled, or outside Development.
        '409':
          description: Non-planned order, changed key reuse, or ambiguous tenant scope.
        '412':
          description: version_conflict; If-Match targets another order or an outdated version. No edit applied.
        '413':
          description: Encoded request exceeds 16 KiB.
        '415':
          description: Application/json required.
        '428':
          description: order_precondition_required; If-Match is missing.
        '503':
          description: order_storage_unavailable; retry the exact body/key/precondition after recovery.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/plants/{plantId}/orders/{orderId}/history:
    get:
      operationId: getOrderHistory
      summary: Read the creation and planning-change history of one authorized order
      description: >-
        Requires current orders.read and exactly one active tenant assignment for the plant.
        Returns append-only evidence in ascending version order, not timestamp order.
        Creation includes the initial five-field plan; edits include only changed fields.
        Actor display name is the verified account name captured at acceptance, or null
        when unavailable. Never infer a name from a raw issuer/subject. These identifiers,
        audit IDs, request keys and receipt internals are not returned. Customer deactivation
        does not hide history. No CSRF/idempotency header required; reads make no writes
        and responses are no-store. Cursors bind tenant, plant, order and limit; keep the
        limit unchanged. New committed versions may appear on continuation; this is not
        a frozen snapshot. Unknown/duplicate query parameters are rejected; no filters yet.
      security:
        - managementSession: []
      parameters:
        - name: plantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Protected continuation; use nextCursor unchanged and URL-encoded.
          schema: { type: string, minLength: 1, maxLength: 2048 }
      responses:
        '200':
          description: Bounded public history with nextCursor, or null at the end.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHistoryPage'
        '400':
          description: invalid_order_history_query; invalid, duplicate or unsupported query/cursor.
        '401':
          description: Valid human management session required; gateway credentials are insufficient.
        '403':
          description: Current permission/scope denied or transport rejected.
        '404':
          description: Order absent from authorized scope, feature disabled, or outside Development.
        '409':
          description: plant_scope_ambiguous; multiple tenant assignments for this plant.
        '503':
          description: order_history_unavailable; safe retry after storage recovery.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /api/v1/plants/{plantId}/orders/settings/notes:
    get:
      operationId: getOrderNotesDefault
      summary: Read the plant default for operator note visibility
      description: >-
        Requires current orders.read in exactly one active tenant assignment.
        No row means hidden at version zero; this read creates nothing. No query
        parameters are supported. Responses are no-store. ETag binds tenant/plant/version.
      security:
        - managementSession: []
      parameters:
        - $ref: '#/components/parameters/NotesDefaultPlant'
      responses:
        '200':
          description: Current plant default, not a live setting inherited by existing orders.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNotesDefault'
        '400': { description: Unsupported query. }
        '401': { description: Verified human session required. }
        '403': { description: Permission/scope or Development transport denied. }
        '404': { description: Feature disabled or outside Development. }
        '409': { description: Ambiguous tenant assignment. }
        '503': { description: Safe storage failure; order_notes_default_unavailable. }
    put:
      operationId: updateOrderNotesDefault
      summary: Deliberately change the default for new orders only
      description: >-
        Requires current orders.notes.default.edit, not merely orders.plan.edit.
        No new grant is implied. Uses same-session antiforgery, exact strong scoped
        If-Match from GET (including version zero), and a retained UUID request key.
        No query parameters; one strict boolean body property; maximum 1 KiB even
        when chunked. Retry the identical body/key/precondition after uncertainty.
        A retry returns the original accepted value/version/ETag without reapplying
        it or changing existing orders. Every new accepted command is audited.
      security:
        - managementSession: []
          managementCsrf: []
      parameters:
        - $ref: '#/components/parameters/NotesDefaultPlant'
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, format: uuid }
        - name: X-Management-CSRF
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrderNotesDefault'
      responses:
        '200':
          description: Accepted result; exact delayed retries may represent an older version.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNotesDefault'
        '400': { description: Invalid JSON/query/key/CSRF/precondition; duplicate or unknown fields rejected. }
        '401': { description: Verified human session required; gateway tokens rejected. }
        '403': { description: Current permission/scope or transport denied. }
        '404': { description: Feature disabled or outside Development. }
        '409': { description: Changed reuse of key or ambiguous tenant assignment. }
        '412': { description: Stale version; version_conflict. }
        '413': { description: Encoded body exceeds 1 KiB. }
        '415': { description: JSON content type required. }
        '428': { description: If-Match required; order_notes_default_precondition_required. }
        '503': { description: Uncertain storage failure; retry the exact command. }
components:
  parameters:
    NotesDefaultPlant:
      name: plantId
      in: path
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    managementSession:
      type: apiKey
      in: cookie
      name: __Host-laundry-management
      description: Protected HttpOnly cookie established by management OpenID Connect login.
    managementCsrf:
      type: apiKey
      in: header
      name: X-Management-CSRF
      description: Request token from /management/antiforgery with its same-session antiforgery cookie.
  schemas:
    OrderNotesDefault:
      type: object
      additionalProperties: false
      required: [notesVisibleToOperators, version]
      properties:
        notesVisibleToOperators: { type: boolean }
        version: { type: integer, format: int64, minimum: 0 }
    UpdateOrderNotesDefault:
      type: object
      additionalProperties: false
      required: [notesVisibleToOperators]
      properties:
        notesVisibleToOperators: { type: boolean }
    OrderHistoryPlan:
      type: object
      additionalProperties: false
      required: [customerId, plannedReceivingDate, plannedDeliveryDate, customerReference, notes, notesVisibleToOperators]
      properties:
        customerId: { type: string, format: uuid }
        plannedReceivingDate: { type: string, format: date }
        plannedDeliveryDate: { type: string, format: date }
        customerReference: { type: [string, 'null'], maxLength: 100 }
        notes: { type: [string, 'null'], maxLength: 2000 }
        notesVisibleToOperators:
          type: [boolean, 'null']
          description: Recorded creation choice; null means not recorded in legacy evidence, not hidden.
    OrderHistoryPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/OrderHistoryEntry'
        nextCursor:
          type: [string, 'null']
    OrderHistoryEntry:
      type: object
      additionalProperties: false
      required: [version, action, recordedAtUtc, actorDisplayName, initialPlan, changes]
      properties:
        version:
          type: integer
          format: int64
          minimum: 1
        action:
          type: string
          enum: [order_created, order_plan_changed]
        recordedAtUtc:
          type: string
          format: date-time
        actorDisplayName:
          type: [string, 'null']
          maxLength: 200
          description: Verified account-name snapshot; null means unavailable, never a guessed name.
        initialPlan:
          description: Creation only; null for planning changes.
          anyOf:
            - $ref: '#/components/schemas/OrderHistoryPlan'
            - type: 'null'
        changes:
          type: array
          maxItems: 6
          description: Empty for creation; only changed fields for a plan change.
          items:
            $ref: '#/components/schemas/OrderPlanChange'
    OrderPlanChange:
      type: object
      additionalProperties: false
      required: [field, before, after]
      properties:
        field:
          type: string
          enum: [customerId, plannedReceivingDate, plannedDeliveryDate, customerReference, notes, notesVisibleToOperators]
        before:
          type: [string, 'null']
          description: Previous value; UUID/date/text or literal true/false strings for visibility. Null visibility means not recorded.
        after:
          type: [string, 'null']
          description: New value with the same representation as before.
    OrderList:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Order'
        nextCursor:
          type: [string, 'null']
          description: Protected continuation token, or null on the last page.
    CreateOrder:
      type: object
      additionalProperties: false
      required: [customerId, plannedReceivingDate, plannedDeliveryDate]
      properties:
        customerId:
          type: string
          format: uuid
        plannedReceivingDate:
          type: string
          format: date
          description: Exact YYYY-MM-DD calendar date, future or past allowed.
        plannedDeliveryDate:
          type: string
          format: date
          description: Exact YYYY-MM-DD on or after receiving date; same-day allowed.
        customerReference:
          type: [string, 'null']
          maxLength: 100
        notes:
          type: [string, 'null']
          maxLength: 2000
        notesVisibleToOperators:
          type: boolean
          description: Explicit choice; omission copies the plant default at first acceptance. Null is rejected.
    UpdateOrderPlan:
      type: object
      additionalProperties: false
      required: [customerId, plannedReceivingDate, plannedDeliveryDate, customerReference, notes]
      properties:
        customerId:
          type: string
          format: uuid
        plannedReceivingDate:
          type: string
          format: date
          description: Exact YYYY-MM-DD calendar date, future or past allowed.
        plannedDeliveryDate:
          type: string
          format: date
          description: Exact YYYY-MM-DD on or after receiving date; same-day allowed.
        customerReference:
          type: [string, 'null']
          maxLength: 100
        notes:
          type: [string, 'null']
          maxLength: 2000
        notesVisibleToOperators:
          type: boolean
          description: Explicit choice; omission preserves the existing order choice, not today's plant default. Null is rejected.
    Order:
      type: object
      additionalProperties: false
      required: [id, plantId, orderNumber, customerId, plannedReceivingDate, plannedDeliveryDate, customerReference, notes, status, version, createdAtUtc, updatedAtUtc]
      properties:
        id:
          type: string
          format: uuid
        plantId:
          type: string
          format: uuid
        orderNumber:
          type: string
        customerId:
          type: string
          format: uuid
        plannedReceivingDate:
          type: string
          format: date
        plannedDeliveryDate:
          type: string
          format: date
        customerReference:
          type: [string, 'null']
        notes:
          type: [string, 'null']
        notesVisibleToOperators:
          type: boolean
          description: Present on current reads/new receipts; absent only in immutable pre-visibility retry receipts. Absence is unknown, never inferred from today's default.
        status:
          type: string
          enum: [planned]
        version:
          type: integer
          format: int64
          minimum: 1
        createdAtUtc:
          type: string
          format: date-time
        updatedAtUtc:
          type: string
          format: date-time
    Problem:
      type: object
      properties:
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        correlationId:
          type: string
